name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (incl. dev linters)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint + format check)
        run: ruff check humorhist tests
      - name: Bandit (security scan)
        run: bandit -c pyproject.toml -r humorhist
      - name: Tests
        run: pytest tests/ -q

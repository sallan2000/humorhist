[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humorhist"
version = "0.1.0"
description = "Humorous history content pipeline - database foundation"
requires-python = ">=3.11"
dependencies = [
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "respx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["humorhist*"]
